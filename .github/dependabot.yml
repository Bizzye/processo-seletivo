version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      testes:
        patterns: ['karma*', 'jasmine*', '@types/jasmine', '@playwright/test']
      lint:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', '@commitlint/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
